services:
  postgres:
    image: postgres:16-alpine
    container_name: setupcard-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: setupcard
      POSTGRES_PASSWORD: setupcard
      POSTGRES_DB: setupcard
    volumes:
      - setupcard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U setupcard -d setupcard']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  setupcard_pgdata:
